<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#f5efe4" />

    <!-- Privacy: this page sets no cookies, runs no analytics, and loads no third-party trackers. -->
    <meta name="robots" content="noindex, nofollow" />
    <meta name="referrer" content="no-referrer" />

    <title>بیتا</title>
    <meta name="description" content="صفحه‌ی یادبود — به یاد کسی که همیشه در قلب ما زنده خواهد ماند." />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="بیتا" />
    <meta property="og:description" content="به یاد کسی که همیشه در قلب ما زنده خواهد ماند." />
    <meta property="og:locale" content="fa_IR" />

    <!-- Give the two things the first screen needs a head start.
         %BASE_URL% is replaced by Vite with the configured base path so these
         resolve correctly under the /bita-memorial/ sub-path. -->
    <link
      rel="preload"
      href="%BASE_URL%assets/fonts/DoranFaNum-VF.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <!-- The portrait is the largest element on screen. If you rename the file
         in src/config/memorial.ts, update this path too (or remove this line). -->
    <link rel="preload" href="%BASE_URL%assets/memorial-photo.jpg" as="image" fetchpriority="high" />

    <style>
      /* Critical paint styles: fill the viewport with the memorial background
         immediately so there is never a white flash before the app mounts. */
      :root { color-scheme: light; }
      html, body { margin: 0; padding: 0; background-color: #f6f1e7; }
      body {
        min-height: 100svh;
        font-family: 'Doran FaNum', Tahoma, 'Segoe UI', system-ui, sans-serif;
        color: #3a352d;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }
      #root { min-height: 100svh; isolation: isolate; }
      .app-loading {
        position: fixed; inset: 0; display: grid; place-items: center;
        background: #f6f1e7; color: #b39a77; font-size: 1.5rem; letter-spacing: .1em;
      }
      @media (prefers-reduced-motion: no-preference) {
        .app-loading { animation: appPulse 2.4s ease-in-out infinite; }
        @keyframes appPulse { 0%, 100% { opacity: .35 } 50% { opacity: .8 } }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="app-loading" aria-hidden="true">✦</div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
