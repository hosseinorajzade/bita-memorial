name: Deploy memorial page to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least-privilege token: only what the official Pages deployment needs.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deployment at a time. Don't cancel an in-progress one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          # Create/repair the Pages site if it isn't set up yet.
          enablement: true

      - name: Install dependencies
        run: npm ci

      - name: Build
        # `base_path` from configure-pages is the URL sub-path this site is
        # served under (e.g. "/bita-memorial"). Vite normalises it to a
        # trailing-slash base so every asset URL is correct on Pages.
        run: npm run build
        env:
          VITE_BASE: ${{ steps.pages.outputs.base_path }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
